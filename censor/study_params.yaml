      (GPT-5.4, 272K, $2.50 -> $5.00); developersdigest "Frontier Model API
      Pricing July 2026" (verified 2026-07-24 against
      developers.openai.com/api/docs/pricing). The previous entry read NOT FOUND
      with a guessed 200K.
    confidence: published
    MUST_MEASURE: false
    CONFLICTING_SOURCE: >-
      morphllm.com "LLM Context Window Comparison (2026)" lists OpenAI as having
      no long-context tier at all. Three sources against one, and the OpenAI
      pricing page itself carries a distinct long-context column (which is where
      cloud.providers.openai.*.long_context_price_* came from), so the dissent is
      treated as an error. It is recorded rather than dropped.
    A3_NEGATIVE: >-
      This value is PUBLISHED, not DERIVED. Arm A3 tried and failed to predict
      threshold placement from serving cost structure: the predicted knee band
      for an 8B GQA model spans 61K-1.34M tokens across accelerator classes and
      the unobservable minimum-batch parameter, so every published threshold
      falls inside it and the test does not discriminate. See
      analysis/prelim/phase2/PHASE2.md section 3. The threshold entry is upgraded
      because a rate card was found, not because the cost model explained it.
    why_it_matters: >-
      RESOLVED CONSEQUENCE: context_floor is 115,440 tokens, which is BELOW the
      272K threshold. At the median turn, OpenAI bills at the short-context
      column, so the above_threshold branch of every Phase-1 table is
      INAPPLICABLE at context_floor. It becomes live only in the tail --
      TraceLab's p90 step prefix reaches ~467K, which does cross 272K. The
      ~2x T2 swing is therefore a p90 phenomenon, not a median one, and Phase 3
      must apply the threshold per sampled trajectory rather than globally.


# =============================================================================
# LOCAL RUNTIME  (software design decisions, NOT hardware properties)
# =============================================================================
# Kept in its own section deliberately. Filing these under local_hardware would
# imply they are properties of the box, which is exactly the error that lets a
# 65x cost swing get assumed away.
local_runtime:

  local_kv_persistence:
    values: [persists, recomputes]
    swept: true
    default_value: persists
    source: >-
      MEASURED 2026-07-27 (characterization Item A):
      analysis/characterization/kv_persistence.md. Source read of llama.cpp at
      commit 91f8c9c5fb038c086e13e9cd823c29b33b07ba54 plus an empirical probe on
      release b10155 (censor/tools/kv_persistence_probe.py; raw timings in
      analysis/characterization/kv_persistence_raw.json). Prior entry read NOT
      SOURCED / confidence guess.
    confidence: measured
    SCOPE: >-
      llama.cpp ONLY. This is NOT a general claim about local runtimes. vLLM,
      SGLang, Ollama, and MLX have their own slot and cache semantics and none of
      them were tested. The parameter remains swept precisely because the
      measurement covers one runtime.
    MUST_DECIDE: false
    NEVER_COLLAPSE: true
    still_swept: true
    measurement_summary: >-
      Default configuration is in the `persists` regime, via two INDEPENDENT
      mechanisms: (1) slot-resident KV with automatic longest-common-prefix reuse
      (cache_prompt defaults true, tools/server/server-task.h:53; LCP at
      server-context.cpp:3154), and (2) an 8 GiB RAM-backed prompt cache
      (cache_ram_mib default 8192, common/common.h:626) that restores state after
      slot eviction. Observed: 5,199 of 5,211 tokens reused on an append-only
      follow-up, 152.91 ms against 22,265.27 ms cold (146x less prefill work).
    reachable_recomputes_conditions:
      runtime_misconfiguration: >-
        `--parallel 1 --cache-ram 0` measured at full recompute (0 tokens reused,
        5,211 prefilled, 20,828.97 ms) against 29.71 ms for the same request with
        the RAM cache enabled -- a 701x gap turning on one flag. Plausible when
        minimising memory on a small box, which is exactly this study's scenario.
        Belongs on a deployment checklist.
      prompt_head_mutation: >-
        See local_runtime.prompt_head_stability. Reuse is PREFIX-ONLY
        (n_cache_reuse defaults 0, common/common.h:621), so any per-turn mutation
        of the prompt head voids the whole cache and silently yields `recomputes`
        on a `persists` configuration. This is the more likely real-world route,
        and it is a SCAFFOLD property, not a runtime property.
    note: >
      Not a hardware property. Determines whether prefill is delta-sized or
      full-context. Dominates T1 cost at production context lengths.
    scale_caveat: >-
      Measured at 5.2K context on a 0.5B model, not at context_floor (115,440) on
      a 7-8B model. The mechanism is size-independent, but the RAM cache's 8 GiB
      budget is not -- see local_runtime.prompt_cache_hit_rate_local. At
      production scale the binary is really a hit rate.
    semantics:
      persists: >-
        The runtime retains KV state for this conversation between turns. Turn
        N+1 prefills only the delta appended since turn N
        (delta_tokens_per_turn, ~1.8K tokens).
      recomputes: >-
        The runtime discards KV between turns. Turn N+1 re-prefills the entire
        resident context (context_floor, ~115K tokens) before generating a
        single output token.
    swing_magnitude:
      value: 64.9
      unit: multiplier_on_t1_prefill_work_per_turn
      source: >-
        Arithmetic on two other parameters in this file:
        workload.context_floor.value (115,440 tokens) divided by
        local_runtime.local_kv_persistence.delta_tokens_per_turn.value
        (1,780 tokens). Not an independent measurement.
      confidence: estimated
      note: >-
        Prefill work per turn, not end-to-end cost; the realised cost swing also
        depends on prefill_tok_per_sec_at_119k, which is unsourced for every
        hardware config. The ~65x is therefore the optimistic framing: it assumes
        local prefill throughput does not itself degrade at 115K context.
    delta_tokens_per_turn:
      value: 1780
      lo: 1719
      hi: 1838
      unit: tokens
      source: >-
        EXTRACTABLE from TraceLab Table 3, avg positive per-step context change
        (Claude 1,719 / Codex 1,838). Table 3 measures the per-step change in
        total input length (prefix + append) versus the previous step, which is
        exactly the token delta a KV-persisting runtime would need to prefill.
      confidence: published
      caveat: >-
        This is a MEAN of positive changes. TraceLab publishes no median for
        per-step context growth, so the delta cannot be matched to the median
        trajectory on a like-for-like basis. See median_construction below.
        VALIDITY (cloud-served agents): Measured on CLOUD-served agents with
        provider prefix caching. Those agents are DESIGNED around that cache:
        append-only context, stable prefixes, no mid-conversation editing,
        because editing invalidates the cache and costs money. A local
        KV-persisting runtime faces no such constraint -- context editing is
        nearly free locally. Direction of bias is unclear (local agents might
        append less via compaction, or more via cheap re-injection), so this
        is not a clean over- or under-estimate. Confidence stays published;
        the transfer to a local runtime is an untested assumption.
      median_construction:
        value: 1089
        unit: tokens
        source: >-
          Constructed by us as median append (875) + median output (214) from
          TraceLab Table 8 / abstract, on the assumption that a turn's delta is
          the freshly appended tokens plus the prior step's output. Both Claude
          (output-resend) and Codex gpt-5.5 (output-resend) re-send prior output
          per TraceLab 5.3, which supports including the output term.
        confidence: estimated
        note: >-
          Recorded so that the mean/median mismatch is visible rather than
          papered over. Sweeps should span 1,089 to 1,838.
    downstream_requirement: >-
      Every downstream phase runs BOTH values and reports BOTH. Never collapse to
      one. If a headline claim holds under only one setting, the claim must name
      the setting it depends on.

  # ---------------------------------------------------------------------------
  # A DISTINCT AXIS. Deliberately NOT filed as a note under local_kv_persistence:
  # this is a scaffold property, it is invisible in every parameter swept before
  # 2026-07-27, and burying it guarantees it gets lost.
  # ---------------------------------------------------------------------------
  prompt_head_stability:
    values: [stable, mutating]
    swept: true
    confidence: measured
    measured_value_mini_swe_agent: stable
    SCOPE: >-
      Measured for mini_swe_agent ONLY (characterization cell 4e). Stays swept
      because it is a per-scaffold property and 15 trajectories of one scaffold
      settle nothing about any other. Scaffolds that inject a memory block,
      re-rank tools by recent usage, stamp the system prompt with a date, or
      compact history in place would land on `mutating` and are untested.
    source: >-
      MEASURED 2026-07-27: analysis/characterization/prompt_head_stability.md
      (cell 4e), from analysis/index_probe/phase1/oa01_verb_turns.jsonl and
      apu_characterization/out/oa01/runs/**/*.traj.json. The MECHANISM was
      measured earlier in Item A (analysis/characterization/kv_persistence.md):
      llama.cpp reuse is prefix-only because n_cache_reuse defaults to 0
      (common/common.h:621) and the reuse point is a longest-common-prefix
      computation (tools/server/server-context.cpp:3154).
    measurement_summary: >-
      252 of 252 consecutive prompt pairs are strictly append-only: the previous
      turn's assembled prompt is an exact byte-prefix of the next. Zero head
      mutations. Corroborated by two independent capture-time measurements that
      a post-hoc log could not fake: per-turn local LCP covers a median 0.9998 of
      the previous prompt (min 0.9984, 314/314 pairs above 0.99), and the
      provider prefix cache recovered 94.17% of structurally redundant tokens
      with 0 reconciliation violations -- arithmetically impossible under head
      mutation. The scaffold config bounds it further: system_template is a
      constant string with no variables and instance_template interpolates only
      {{task}}, fixed per run. There is no step, observation, or history-rewriting
      template in the config at all.
    note: >
      Prefix-only reuse means any per-turn mutation of the prompt head voids the
      entire cache. Silent failure -- no error, no warning, no log line at default
      verbosity. Measured cliff on the Item A probe: 152.91 ms -> 22,265.27 ms,
      146x. Scaffold property, not runtime property. Measured in D4.
    semantics:
      stable: >-
        The prompt head (system prompt, tool definitions, task statement) is
        byte-identical across turns; context grows append-only. The LCP spans the
        whole prior context and delta prefill applies.
      mutating: >-
        Something near the head changes per turn -- rotating timestamp, reordered
        tool list, injected memory block, turn counter, environment state dump.
        LCP collapses to the position of the first differing token, and every
        token after it is re-prefilled.
    why_it_matters: >-
      If our scaffold mutates the head, then for that scaffold `recomputes` is the
      realistic case REGARDLESS of runtime configuration, and every
      persists-based conclusion in Phases 1-2 becomes scaffold-conditional.
    RESOLVED_FOR_THIS_SCAFFOLD: >-
      It does not mutate. Every Phase-1/Phase-2 persists-based conclusion stands
      for mini_swe_agent, and `recomputes` remains a swept alternative rather
      than the operative default. A stable head does NOT imply a hit: it makes
      the prefix REUSABLE, while prompt_cache_hit_rate_local governs whether the
      prefix is still RESIDENT. The two are independent and both must hold.
    cross_tier_note: >-
      TraceLab measured CLOUD-served agents, which are designed around provider
      prefix caching because head mutation costs money there. Local agents face no
      such economic pressure, so nobody has been enforcing the discipline. The
      discipline required is identical; the incentive to follow it has been absent
      locally until this measurement supplied one.

  prompt_cache_hit_rate_local:
    value: null
    lo: 0.5
    hi: 1.0
    unit: fraction_of_turns_hitting_retained_kv
    confidence: guess
    MUST_MEASURE: true
    source: >-
      NOT MEASURED and deliberately left null -- no midpoint. lo/hi is the sweep
      range used in characterization cell 2c (analysis/characterization/
      latency_ratio.csv), not an estimate of the true value. Derived from the
      llama.cpp cache-capacity arithmetic in Item A.
    note: >
      cache_ram_mib default 8192 (common/common.h:626). At context_floor on a 7-8B
      model each cache entry is roughly 1 GiB of sequence state, so the default
      budget holds only a handful of prefixes and the FIFO eviction in
      tools/server/server-task.cpp:1816-1838 fires under realistic session counts.
      persists/recomputes is therefore a HIT RATE at production scale, not a
      binary.
    consequence: >-
      T_local is a MIXTURE, not a point:
      T_local_expected = h*T_local(delta) + (1-h)*T_local(context_floor).
      Because the miss path is ~700x the hit path, the expected value sits far
      closer to the miss end than the hit latency suggests: at h = 0.95 against a
      20.8 s miss, expected cost is ~1.04 s per turn versus a 29.71 ms hit.
      Any claim quoting hit-path latency alone is quoting the best case of a
      heavy-tailed mixture.
    eviction_policy_note: >-
      FIFO (states.pop_front() on the oldest entry), NOT LRU. A long-running
      session's prefix can be evicted by unrelated recent traffic even while it is
      still the most valuable entry to keep.

  prefill_scaling_exponent:
    value: 0.344
    lo: 0.270
    hi: 0.454
    unit: power_law_alpha_in_R_L_eq_R512_times_512_over_L_to_alpha
    confidence: measured
    SCOPE: >-
      SHAPE only. Measured 2026-07-28 on Lunar Lake CPU (Intel Core Ultra 5 325)
      with Qwen2.5-0.5B Q4_K_M via llama-bench cold prefill at depths
      512/2048/8192/32768/65536. Absolute rates do NOT transfer to 7-8B or to
      Strix Halo / Apple / RTX 5090. Only the exponent is claimed when applied
      at context_floor on target hardware.
    source: >-
      analysis/characterization/v2/prefill_scaling.csv and prefill_fit.json
      (Item H). R^2=0.888. Discrimination excludes optimistic_flat and
      quadratic_pessimistic; primary verdict linear_attention_theoretic.
    regime: EXTRAPOLATED
    extrapolation_distance: >-
      Deepest measured depth 65,536 tokens; applied at context_floor 115,440
      (1.8x beyond deepest) on a different model class and memory hierarchy.
      Allocation succeeded at every requested depth on the 0.5B probe.
    rates_tok_per_sec_measured:
      512: 280.38
      2048: 255.23
      8192: 185.37
      32768: 89.40
      65536: 52.17
    note: >
      Replaces the Phase-2 three-model bracket for Item B re-runs. Still swept
      as a band via lo/hi (leave-one-out), never collapsed to the point alone.
      Under the fitted alpha, only discrete_gpu_rtx5090 at h=1.0 survives the
      latency comparison (1/15 combinations).


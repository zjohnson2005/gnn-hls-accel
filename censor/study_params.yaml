# =============================================================================
# T0 DETERMINISTIC TIER
# =============================================================================
t0:
  applicability_sweep:
    values: [0.0, 0.15, 0.45]
    unit: fraction_of_turns
    source: >-
      Sweep specified by the study design. The 0.45 endpoint is the production
      figure from Progressive Crystallization (arXiv:2607.07052, Malik 2026):
      share of executions served by deterministic Type-1 workflows rose from 0 to
      ~45% over eight months (with ~30% hybrid, ~25% agent-orchestrated).
    confidence: published
    EXTERNAL_VALIDITY_FLAG: >-
      The 45% figure is from a cloud-network IT-operations incident platform,
      NOT from coding agents. Its own limitations section states results come from
      a single organization and domain and that thresholds should be re-derived
      elsewhere. Applying it to TraceLab's coding-agent workload is a transfer
      assumption, not a measurement. The paper also notes the benefit shrinks in
      environments dominated by genuinely novel one-off work.
  cost_usd:
    value: 0.0
    source: >-
      Progressive Crystallization Table I: Type-1 deterministic playbooks are
      "zero token cost" with no LLM at runtime
    confidence: published
  latency_ms:
    value: 5.45
    lo: 3.9
    hi: 7.0
    unit: milliseconds
    source: >-
      Modeled as the orchestration floor only (no model call). Progressive
      Crystallization says a Type-1 run "completes in milliseconds" but publishes
      no distribution; we substitute our own measured orchestration floor.
    confidence: estimated
  joules:
    value: null
    source: >-
      NOT SOURCED. A T0 hit still runs orchestration + tool code on the host.
      Treated as ~0 for this phase; that biases T0 to look free.
    confidence: guess
    MUST_MEASURE: false

# =============================================================================
# SWITCHING (Phase 3)
# =============================================================================
switching:
  kv_crosses_tier_boundary:
    value: false
    source: >-
      Modeling premise: KV state cannot be moved into or out of a metered
      provider's cache. Supported indirectly by TraceLab's finding that provider
      cache misses force full re-prefill (Table 12, prefill amplification 5.3x),
      but the impossibility itself is an architectural assumption we are making.
    confidence: estimated
  cost_shape:
    value: step_function
    source: >-
      Implied by workload.context_floor: the median step already carries ~115K
      resident context after a median of 2 steps, so a tier change re-prefills
      approximately context_floor whether it happens at turn 1 or turn 20.
    confidence: estimated
    supersedes: >-
      An earlier ramp model in which switching cost grew with turn index. That
      model is WRONG at production context lengths: it assumed context accumulates
      into its final size across a trajectory, whereas TraceLab shows context
      starts near its final size (system prompt, codebase context, tool
      definitions) and accumulation adds only ~3% at the median.
    definition: >-
      switch_cost(turn) = re-prefill of (context_floor + accumulated_growth) on the
      arriving tier, incurred on ANY tier change landing on a tier that holds no KV
      for this context. Flat and expensive from turn one; the turn index modulates
      it by only a few percent at the median.

  asymmetry_note: >-
    Staying on T2 hits the provider prefix cache at 0.1x input price (published
    multiplier). Arriving at T2 without a warm cache pays 1.0x (or the 1.25x 5m
    cache-write rate). Arriving at T1 pays local prefill compute at
    prefill_tok_per_sec_at_119k, which is unsourced for every config. This
    asymmetry is the object of Phase 3.

  interaction_with_local_kv_persistence: >-
    If local_runtime.local_kv_persistence == recomputes, the local tier pays
    approximately the switch cost on EVERY turn, not only on tier changes, because
    it rebuilds full context each time. In that setting the distinction between
    "switching cost" and "steady-state local cost" collapses. Phase 3 must not
    report a switch count as a meaningful cost driver without stating which
    persistence setting is in force.

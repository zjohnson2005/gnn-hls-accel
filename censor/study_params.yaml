    lo: 128000
    hi: 400000
    unit: tokens
    source: >-
      RESOLVED 2026-07-27 (prelim Phase 2, Arm A3) from PUBLISHED rate-card
      reporting, NOT from our cost model. Three independent secondary sources
      agree on 272K for the GPT-5.4/5.5 families: alatirok.com "LLM Long-Context

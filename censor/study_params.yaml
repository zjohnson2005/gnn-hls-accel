# =============================================================================
# ALL prefill/decode rates below are `published` community benchmarks, NOT measured
# by us. Two systematic caveats apply to every row:
#
#  CAVEAT-PP512: every published prefill number is pp512 (512-token prompt). Our
#    workload's median context is ~119K tokens. Prefill rate at 119K is materially
#    lower than pp512 and is NOT published for any of these configs.
#  CAVEAT-MOE: at the "30B class" a sparse MoE (e.g. Qwen3-30B-A3B, ~3B active) and
#    a dense 32B differ by ~7x in decode on the same box. They are recorded
#    separately; collapsing them would be a modeling error.
local_hardware:

  common:
    electricity_usd_per_kwh:
      value: 0.1844
      lo: 0.0871
      hi: 0.1883
      unit: usd_per_kwh
      source: >-
        EIA Electric Power Monthly Table 5.3 / 5.6.A, May 2026: US residential
        18.44 c/kWh; industrial 8.71 c/kWh; 2026 monthly residential peak
        18.83 c/kWh (April). 2026 YTD residential 18.11 c/kWh.
      confidence: published
      note: lo is industrial rate (colo-like), hi is residential peak month
    assumed_lifetime_months:
      value: 36
      lo: 24
      hi: 60
      unit: months
      source: "NO SOURCE. Pure modeling choice for capex amortization."
      confidence: guess
      MUST_MEASURE: false
      MUST_DECIDE: true
      why_it_matters: >-
        Amortized capex is one of the two components of T1 usd. A 24-vs-60 month
        assumption moves the amortization term by 2.5x with zero empirical content.
    capex_utilization:
      description: >-
        Fraction of the machine's service life actually spent doing inference for
        this workload. There is ONE amortization formula:

          amortized_capex_usd_per_inference_second
            = capex_usd / (assumed_lifetime_months * 2.628e6 s/month * capex_utilization)

        Utilization is the free parameter in that formula, not a choice between
        competing amortization philosophies. Total capex must be recovered over the
        life of the box; if the box is only inferring for fraction U of its life,
        each inference second must carry 1/U of the capex burden. LOW utilization
        therefore makes local MORE expensive per inference second, not less.
      value: 0.145
      lo: 0.033
      hi: 1.00
      unit: fraction_of_service_life_spent_inferring_this_workload
      source: >-
        The parameter itself is unsourced (a deployment property, not a measurable
        constant), but the anchor points come from TraceLab Table 7 wall-clock
        decomposition. See anchors below.
      confidence: guess
      MUST_DECIDE: false
      SWEEP_AS_FIRST_CLASS_PARAMETER: true
      anchors:
        dedicated_box_uncapped:
          value: 0.033
          source: >-
            TraceLab Table 7, per session: LLM generation is 3.3% of session
            wall-clock (human thinking 92.3%, tool execution 4.8%). A box dedicated
            to one TraceLab-shaped agent stream is generating ~3% of the time.
          confidence: published
          note: worst case for local; each inference second carries ~30x the capex burden
        dedicated_box_human_capped_1h:
          value: 0.145
          source: >-
            TraceLab Table 7, per session with each idle gap capped at 1 hour:
            LLM generation rises to 14.5% of the now cache-relevant budget
            (human 64.3%, tool 21.2%).
          confidence: published
          note: >-
            The 1h cap is TraceLab's own device for excluding sessions left open
            for days; it is the more realistic denominator for a box that sleeps
            or serves other work during long gaps.
        fully_time_shared:
          value: 1.00
          source: >-
            Modeling limit: the box is saturated by this or other paying work for
            its entire life, so capex amortizes at the lowest possible per-second
            rate. Not achievable for a single interactive agent stream.
          confidence: estimated
          note: best case for local; a lower bound on per-second capex
      why_it_matters: >-
        The anchors span ~30x (0.033 to 1.00). Phase 4 must report where in that
        span the T1-vs-T2 comparison flips, rather than picking a value. Combined
        with assumed_lifetime_months (24-60), the amortization term is uncertain by
        roughly 75x on pure modeling choices with no empirical content.


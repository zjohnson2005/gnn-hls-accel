# Preliminary tier-placement study — parameter set
#
# SCOPE: three-tier per-turn cost model (T0 deterministic / T1 local / T2 cloud).
# Every value carries `source` and `confidence` in {measured, published, estimated, guess}.
#
# confidence semantics:
#   measured  - we measured it on our own instrumented runs
#   published - taken from a paper, vendor rate card, or named community benchmark
#   estimated - derived/interpolated by us from published values; not directly published
#   guess     - no source exists; a modeling choice. MUST be reported as a range and
#               sits at the top of the "must measure / must decide" list.
#
# NOTE ON RANGES: where confidence != measured, `lo`/`hi` are authoritative and
# `value` is only a convenience midpoint for smoke runs. Report ranges, not points.

meta:
  schema_version: prelim_tiers_v1
  created: 2026-07-27
  primary_workload_source: >-
    TraceLab: Characterizing Coding Agent Workloads for LLM Serving,
    arXiv:2606.30560 (v2, 2026-06-29), Zhu/Jacob/Ma/Pan/Wang/Krishnamurthy/Kasikci,
    UW SyFI. ~4,300 sessions, ~357k LLM steps, ~433k tool calls, Claude Code + Codex,
    Sep 2025 - Jun 2026.
  known_bias_of_workload_source: >-
    TraceLab is self-collected from the authors' own day-to-day use (37 Claude / 22
    Codex distinct users, their own projects). The paper states this bias explicitly.
    It is coding-agent traffic, not general agent traffic.
  out_of_scope_this_phase:
    - policy search
    - discrete-event simulation
    - quality / accuracy model
    - thermal modeling

# -----------------------------------------------------------------------------
# RESOLVED MODELING DECISIONS
# Choices that no source can settle, decided explicitly at the Phase 0 gate so
# that later phases cannot re-litigate them silently.
# -----------------------------------------------------------------------------
decisions:
  trajectory_unit:
    value: request
    decided: 2026-07-27
    rationale: >-
      A "trajectory" is one user request and the agent loop that answers it:
      ~8.7 steps average, median 2, p90 21 (workload.turns_per_trajectory.per_request_steps).
      TraceLab's per-SESSION figures (~82.5 steps) span human idle gaps of hours to
      days, during which the provider prefix cache has expired and the local box
      would be idle. Those gaps are a separate phenomenon from execution placement.
    consequence: >-
      Phase 3 simulates a median-to-p90 request, not a session. Cross-request cache
      expiry is therefore NOT in scope, which means the study uses the FAVORABLE
      cache assumption for cloud (tool-result hit rate ~97.5%, not the 84.4%
      user-initiated rate). State this whenever a cloud cost is quoted.

  long_context_pricing:
    value: carry_both_bounds
    decided: 2026-07-27
    rationale: >-
      cloud.long_context_threshold_tokens could not be sourced and our median
      context (~119K) sits in the ambiguous region. Collapsing to a midpoint would
      invent a fact.
    consequence: >-
      Every OpenAI T2 cost is reported as a [short-context, long-context] interval,
      never a point. If the interval does not change the T1-vs-T2 verdict, say so
      and the unknown stops mattering. If it does, the threshold becomes a
      must-confirm item ahead of any hardware work.

  local_kv_persistence_handling:
    value: sweep_both_never_collapse
    decided: 2026-07-27
    rationale: >-
      Whether the local runtime holds KV across turns swings T1 prefill work by
      ~65x (see local_runtime.local_kv_persistence.swing_magnitude). It is a
      software design decision, not a hardware property, so no benchmark or trace
      can settle it and no default is defensible.
    consequence: >-
      Every phase from 1 onward emits results for BOTH persists and recomputes.
      Any headline claim that holds under only one setting must name that setting
      in the claim itself.

  switching_cost_shape:
    value: step_function_at_context_floor
    decided: 2026-07-27
    rationale: >-
      Median context is ~119K after a median of 2 steps, so context starts near
      its final size rather than accumulating into it. The prior ramp-with-turn-index
      model was wrong at production context lengths.
    consequence: >-
      workload.context_floor is promoted to a primary parameter;
      workload.context_growth_by_turn_index is demoted to a ~3% correction that is
      still retained for the p90 tail. See switching.cost_shape.

  trajectory_sampling:
    value: empirical_distribution_sampling
    n_samples: 1000
    decided: 2026-07-27
    rationale: >-
      Steps per request are mean 8.7, median 2, p90 21, p99 87 (TraceLab Table 2).
      That is a heavy tail, and it means there is NO representative trajectory. A
      single "typical" 8.7-step run would be actively misleading in both
      directions: 8.7 is above the median, so it over-states the cost of the
      majority of requests, while simultaneously under-stating the tail that
      carries most of the aggregate cost. Reporting one number from a heavy-tailed
      distribution is the specific failure this study is supposed to avoid.
    method: >-
      Sample >=1000 trajectories from the empirical steps-per-request distribution
      and report the resulting COST DISTRIBUTION (median, p90, p99, mean), not a
      point. Deterministic seed; the seed is recorded with every emitted artifact.
    distribution_source: >-
      TraceLab Table 2, per request: user-initiated 0.9 avg (p50 1, p90 1, p99 1)
      plus tool-initiated 7.8 avg (p50 1, p90 20, p99 86). Only these five
      quantiles are published; the full distribution is not. The sampler must
      therefore fit to published quantiles and DECLARE the interpolation family it
      uses, which is an added assumption, not a measurement.
    fallback_if_fit_is_unstable: >-
      Report median / mean / p90 trajectories as SEPARATE rows, never averaged
      together. This is the minimum acceptable output.
    hard_constraint: >-
      No single-number trajectory cost may be emitted without an accompanying
      distribution or the three-row breakdown.

  capex_amortization:
    value: sweep_utilization_as_first_class_parameter
    decided: 2026-07-27
    rationale: >-
      Utilization is the free parameter in a single amortization formula, not a
      choice between rival accounting philosophies. See
      local_hardware.common.capex_utilization.
    consequence: >-
      Phase 4 reports the utilization value at which the winning tier flips, using
      TraceLab's 3.3% / 14.5% generation-share anchors as reference points on that
      axis rather than as the answer.

# =============================================================================
# WORKLOAD  (TraceLab arXiv:2606.30560)
# =============================================================================
workload:

  prefix_cache_hit_rate_overall:
    value: 0.957
    lo: 0.957
    hi: 0.958
    unit: fraction_of_input_tokens
    token_weighted: true
    source: "TraceLab Table 11: total 95.7% (Claude 95.8%, Codex 95.7%)"
    confidence: published

  prefix_cache_hit_rate_tool_result:
    value: 0.975
    lo: 0.972
    hi: 0.979
    unit: fraction_of_input_tokens
    source: "TraceLab Table 11: total 97.5% (Claude 97.9%, Codex 97.2%)"
    confidence: published
    note: >-
      The 97.9% figure in the task brief is the Claude-only column. The
      cross-provider total is 97.5%. Both are recorded; sweeps use lo..hi.

  prefix_cache_hit_rate_user_initiated:
    value: 0.844
    lo: 0.782
    hi: 0.869
    unit: fraction_of_input_tokens
    source: "TraceLab Table 11: total 84.4% (Claude 86.9%, Codex 78.2%)"
    confidence: published

  cache_hit_rate_vs_idle_gap:
    description: >-
      Hit rate degrades with the idle gap preceding a step. Only qualitative
      thresholds are stated in text; the curve itself is Figure 11 and cannot be
      read off numerically.
    gap_where_misses_appear_min:
      value: 5
      unit: minutes
      source: "TraceLab 7.2: 'when the gap is larger than 5 minutes, low-hit-rate steps begin to appear'"
      confidence: published
    gap_where_almost_all_miss_min:
      value: 60
      unit: minutes
      source: "TraceLab 7.2: 'after 1 hour, almost all steps miss the cache'"
      confidence: published

  # ---- per-step token shape ----
  tokens_per_step:
    prefix_tokens_median:
      value: 119000
      lo: 115584
      hi: 126180
      unit: tokens
      source: "TraceLab abstract/5.1 + Table 8: median ~119K overall; Claude 126,180 / Codex 115,584"
      confidence: published
    prefix_tokens_p90:
      lo: 201600
      hi: 467082
      unit: tokens
      source: "TraceLab Table 8 P90 (Codex 201,600 / Claude 467,082)"
      confidence: published
    append_tokens_median:
      value: 875
      lo: 857
      hi: 886
      unit: tokens
      source: "TraceLab abstract + Table 8 P50 (Claude 857 / Codex 886)"
      confidence: published
    append_tokens_p90:
      lo: 5342
      hi: 8310
      unit: tokens
      source: "TraceLab Table 8 P90"
      confidence: published
    output_tokens_median:
      value: 214
      lo: 184
      hi: 252
      unit: tokens
      source: "TraceLab abstract (214 overall) + Table 8 P50 (Claude 252 / Codex 184)"
      confidence: published
    output_tokens_p90:
      lo: 939
      hi: 1671
      unit: tokens
      source: "TraceLab Table 8 P90"
      confidence: published

  input_output_token_ratio_per_turn:
    append_to_output_median:
      value: 4.09
      unit: ratio
      source: "derived from TraceLab medians: 875 append / 214 output"
      confidence: published
      note: arithmetic on two published medians; no new assumption
    total_input_to_output_median:
      value: 559.7
      unit: ratio
      source: "derived from TraceLab medians: (119000 prefix + 875 append) / 214 output"
      confidence: published
      note: >-
        This ~560:1 input:output ratio is the single most important shape fact
        for the study. Long context, short output.

  # ---- trajectory length ----
  turns_per_trajectory:
    trajectory_definition_warning: >-
      TraceLab reports per-SESSION and per-REQUEST separately, and they differ by
      an order of magnitude. "Turns per trajectory" is therefore a definitional
      choice, not a measured constant. Both are recorded; the trajectory sim must
      state which it uses.
    per_request_steps:
      avg: 8.7
      p50: 2
      p90: 21
      p99: 87
      unit: steps
      source: >-
        TraceLab Table 2 per request: user-initiated 0.9 avg (p50 1) +
        tool-initiated 7.8 avg (p50 1, p90 20, p99 86)
      confidence: published
    per_session_steps:
      avg: 82.5
      p50: 16
      p90: 152
      p99: 1236
      unit: steps
      source: >-
        TraceLab Table 2 per session: user-initiated 8.9 avg (p50 1, p90 17, p99 129) +
        tool-initiated 73.6 avg (p50 15, p90 135, p99 1107)
      confidence: published
    tool_calls_per_step:
      avg: 1.2
      p50: 1
      p90: 2
      p99: 4
      unit: calls
      source: "TraceLab Table 2 per step"
      confidence: published

  # ---- context floor (PRIMARY) ----
  # Context does not GROW into 119K across turns. It STARTS there: system prompt,
  # codebase context, and tool definitions are resident from turn one. With a
  # median of 2 steps per request and ~1.8K growth per step, accumulation accounts
  # for ~3.6K of a ~119K median context, i.e. ~3%.
  #
  # CONSEQUENCE FOR SWITCHING: switching cost is a STEP FUNCTION at context_floor,
  # incurred on any tier change landing on a tier that holds no KV for this
  # context. It is expensive from turn one. It does NOT ramp with turn index.
  context_floor:
    value: 115440
    lo: 111908
    hi: 122742
    unit: tokens
    source: >-
      DERIVED from two published TraceLab figures: median per-step prefix tokens
      (Table 8: overall ~119,000; Claude 126,180 / Codex 115,584) minus median
      steps-per-request (Table 2: p50 = 2) times avg positive per-step growth
      (Table 3: Claude 1,719 / Codex 1,838).
      Overall: 119,000 - 2*1,780 = 115,440.
      Claude:  126,180 - 2*1,719 = 122,742 (hi).
      Codex:   115,584 - 2*1,838 = 111,908 (lo).
    confidence: estimated
    PRIMARY: true
    caveat: >-
      Mixes a median (prefix tokens, steps per request) with a mean (per-step
      growth) because TraceLab publishes no median for per-step growth. The
      correction term is ~3% of the total, so the impurity is small relative to
      the quantity, but the derivation is not distributionally clean and must not
      be described as measured.
    why_it_matters: >-
      context_floor is the token count that a tier switch must re-prefill, and the
      residency that a cloud provider charges cache rent on every single turn. It
      is the dominant scale parameter in the study. The growth curve below is a
      ~3% correction to it at the median.
    tail_qualification: >-
      Growth is secondary at the median but NOT negligible in the tail: at p90 of
      21 steps per request, accumulation contributes ~21*1,780 = ~37K tokens on
      top of context_floor, roughly a third again. Phase 3 must therefore still
      carry the growth term; "secondary" means subordinate to context_floor, not
      droppable.

  # ---- context growth (SECONDARY) ----
  # Demoted: a ~3% correction to context_floor at the median trajectory. Retained
  # because it still matters in the p90 tail (see context_floor.tail_qualification).
  context_growth_by_turn_index:
    PRIORITY: secondary
    superseded_note: >-
      This block previously carried `initial_context_tokens` (4K-80K, estimated),
      which implied context ramps up from a small base. That framing was wrong:
      the median step already sits at ~119K prefix after a median of 2 steps.
      `initial_context_tokens` has been replaced by the primary `context_floor`
      parameter above.
    EXTRACTION_STATUS: PARTIAL
    extraction_note: >-
      TraceLab does NOT publish a context-length-vs-turn-index curve. It publishes
      (a) mean positive per-step context growth, and (b) append tokens conditioned on
      prefix bucket (Table 9), and (c) one example session as Figure 10. The curve
      used by the trajectory sim is therefore CONSTRUCTED by us from (a) and is
      marked `estimated`.
    avg_positive_growth_per_step:
      value: 1780
      lo: 1719
      hi: 1838
      unit: tokens_per_step
      source: "TraceLab Table 3, all steps: Claude 1,719 / Codex 1,838 avg positive growth"
      confidence: published
    avg_positive_growth_tool_initiated:
      lo: 1746
      hi: 1783
      unit: tokens_per_step
      source: "TraceLab Table 3, tool-initiated steps"
      confidence: published
    avg_positive_growth_user_initiated:
      lo: 1527
      hi: 2742
      unit: tokens_per_step
      source: "TraceLab Table 3, user-initiated steps (Claude 1,527 / Codex 2,742)"
      confidence: published
    fraction_of_steps_that_grow:
      lo: 0.9656
      hi: 0.9960
      unit: fraction
      source: "TraceLab Table 3 'Positive (growth) %' (Codex 96.56% / Claude 99.60%)"
      confidence: published
    growth_model_shape:
      value: linear
      source: "our modeling choice; TraceLab publishes only the mean per-step delta"
      confidence: estimated
      note: >-
        Linear accumulation at avg_positive_growth_per_step. Real sessions show
        compaction drops (see context_compaction) and are not strictly linear.
    context_compaction:
      sessions_with_at_least_one:
        lo: 0.045
        hi: 0.184
        unit: fraction_of_sessions
        source: "TraceLab Table 4 (Claude 4.5%, Codex 18.4%); 9.7% overall in text"
        confidence: published
      note: >-
        Compaction is a >=64k total-input drop. Not modeled in this phase
        (out of scope), but it caps context growth in reality.

  # ---- tool latency ----
  tool_latency_distribution:
    EXTRACTION_STATUS: PARTIAL
    extraction_note: >-
      Per-tool median and p5/p95 for the top tools exist ONLY as Figure 9 (box plot)
      and cannot be read off numerically from the text. What IS extractable is the
      aggregate distribution and the Codex per-tool overhead table (Table 10, which
      reports RESIDUAL/overhead percentiles, not full tool latency). Per-tool p5/p95
      is therefore NOT sourced and is not used.
    aggregate_mean_s:
      value: 16.8
      unit: seconds
      source: "TraceLab 6.2: 'average tool-call latency is 16.8s'"
      confidence: published
    aggregate_median_s:
      value: 0.3
      unit: seconds
      source: "TraceLab Table 7, individual positive tool latencies: median 0.3s"
      confidence: published
    aggregate_p90_s:
      value: 13.6
      unit: seconds
      source: "TraceLab Table 7, individual positive tool latencies: p90 13.6s"
      confidence: published
    aggregate_p5_s:
      value: null
      unit: seconds
      source: "NOT PUBLISHED - Table 7 reports median and p90 only; Figure 9 whiskers are not numeric"
      confidence: guess
      MUST_MEASURE: true
    tail_share:
      calls_over_1min_fraction:
        lo: 0.031
        hi: 0.049
        unit: fraction_of_calls
        source: "TraceLab 6.2 (Claude 4.9%, Codex 3.1%)"
        confidence: published
      time_share_of_calls_over_1min:
        lo: 0.61
        hi: 0.92
        unit: fraction_of_tool_time
        source: "TraceLab 6.2 (Claude 92%, Codex 61%)"
        confidence: published
    top_tools:
      claude: [Bash, Read, Edit]
      codex: [exec_command, write_stdin, apply_patch]
      concentration:
        claude_top3_share: 0.80
        codex_top3_share: 0.95
        source: "TraceLab 6.1: top three account for >80% (Claude) and 95% (Codex) of calls"
        confidence: published
      per_tool_median_s_codex:
        note: >-
          Table 10 'P50/90/99' columns are the POSITIVE RESIDUAL (overhead) stats,
          not total tool latency. Recorded here only to avoid misuse.
        all_timed_residual_p50_s: 0.13
        all_timed_residual_p90_s: 0.24
        all_timed_residual_p99_s: 10.0
        source: "TraceLab Table 10, 253k Codex calls with valid e2e + internal timing"
        confidence: published

  # ---- redundant prefill (context for the cache argument) ----
  redundant_prefill:
    fresh_pct_of_append:
      value: 0.190
      lo: 0.123
      hi: 0.258
      unit: fraction
      source: "TraceLab Table 12: total 19.0% (Claude 12.3%, Codex 25.8%)"
      confidence: published
    prefill_amplification:
      value: 5.3
      lo: 3.9
      hi: 8.1
      unit: multiplier
      source: "TraceLab Table 12: 5.3x total (Claude 8.1x, Codex 3.9x)"
      confidence: published
    cost_share_prefix_tokens:
      value: 0.595
      unit: fraction_of_api_spend
      source: "TraceLab 4.3 / Table 5: prefix tokens are 59.5% of cost, append 29.2%, output 11.2%"
      confidence: published
      note: >-
        This is the anchor for Phase 2: under a real cache, cloud spend is
        dominated by CACHE READS of accumulated context, not by fresh input or output.


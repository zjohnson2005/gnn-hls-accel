# NPU amendment 2026-10-14b (canary cell in a child process).
# inprocess_transition_record: the first two sessions under the amendment
# also run the canary in-process at the record-only and first post-arm
# points (record only, never gating). Set to false by a commit after the
# second session.
inprocess_transition_record: true
child_timeout_s: 180
